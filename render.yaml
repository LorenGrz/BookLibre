# Render Blueprint — BookLibre (monorepo LorenGrz/BookLibre)
#
# Servicios gratuitos:
#   booklibre-api  → https://booklibre-api.onrender.com   (Docker / Spring Boot)
#   booklibre-web  → https://booklibre-web.onrender.com   (Static Site / Vite)
#   booklibre-db   → PostgreSQL free (expira ~30 días, Flyway lo recrea solo)
#   booklibre-kv   → Key Value Valkey free (cache de libros populares)
#
# Secrets que se cargan A MANO en el dashboard de Render (nunca en el repo):
#   MONGODB_URI  → string SRV de MongoDB Atlas M0
#   JWT_SECRET   → clave ≥32 caracteres
#
# Nota: el plan free del web service se duerme tras 15 min de inactividad (cold start ~60s).

databases:
  - name: booklibre-db
    plan: free
    region: oregon
    databaseName: booklibre
    user: booklibre

services:
  - type: keyvalue
    name: booklibre-kv
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: booklibre-api
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/LorenGrz/BookLibre
    branch: feat/deploy
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/libros/home?usuarioId=1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70
      - key: JWT_EXPIRATION
        value: "900000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://booklibre-web.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: booklibre-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: booklibre-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: booklibre-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: booklibre-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: booklibre-db
          property: password
      - key: REDIS_URL
        fromService:
          name: booklibre-kv
          type: keyvalue
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

